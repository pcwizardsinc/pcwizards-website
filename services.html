                <div id="topic-1" class="hidden p-6 bg-white border-t border-gray-100">
                    <p class="mb-4 text-gray-700">On my 2008 Server, I run Hyper-V, and for whatever reason, this error code reared its ugly head while trying to update it. To Resolve this error code, do the following:</p>
                    <div class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm shadow-inner mb-4 whitespace-pre-line">
                        net stop wuauserv
                        cd %systemroot%\SoftwareDistribution
                        ren Download Download.old
                        net start wuauserv
                        net stop bits
                        net start bits
                    </div>
                    <ul class="list-disc pl-5 text-gray-700 space-y-1">
                        <li>Save the file as <code class="bg-gray-100 text-red-600 px-1 rounded">Repair.bat</code> and place on the Desktop of your 2008 R2 Server.</li>
                        <li>Run the batch file.</li>
                        <li>After running the batch file, you will have to run the Service Pack again. It should go through this time! (Good Luck!)</li>
                    </ul>

                <div id="topic-5" class="hidden p-6 bg-white border-t border-gray-100 space-y-4 text-gray-700">
                    <div>
                        <h4 class="font-bold text-gray-900 border-b pb-1 mb-2">What is Switchable Graphics Technology?</h4>
                        <p class="leading-relaxed">Switchable Graphics is a laptop technology that utilizes both the graphical processing capabilities of a discrete graphics adapter and the power efficiency of an integrated graphics adapter. It engages discrete graphics only when needed for 3D applications, conserving energy the rest of the time.</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-900 border-b pb-1 mb-2">How to Enable Switchable Graphics?</h4>
                        <p class="mb-2">To ensure full compatibility it is recommended to use the latest graphics driver for both integrated and discrete high-performance GPUs provided by the laptop manufacturer. It will not function if the power-saving GPU does not have any display drivers installed.</p>
                        <ol class="list-decimal pl-5 space-y-1">
                            <li>Install the latest Intel graphics driver from Intel or the manufacturer website.</li>
                            <li>Install the latest AMD graphics driver from AMD or the manufacturer website.</li>
                        </ol>
                        <p class="text-sm text-amber-700 bg-amber-50 p-2.5 rounded-lg border border-amber-100 mt-2 font-medium"><i class="fas fa-exclamation-triangle"></i> Note: Check Windows Device Manager first. High-performance GPUs can sometimes show up under other devices as a generic video controller.</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-900 border-b pb-1 mb-2">Configuring Switchable Graphics</h4>
                        <ol class="list-decimal pl-5 space-y-1">
                            <li>Right-click the Desktop and select <strong>AMD Radeon Settings</strong>.</li>
                            <li>Select <strong>Preferences</strong> &rarr; <strong>Radeon Additional Settings</strong>.</li>
                            <li>Navigate to <strong>Power</strong> &rarr; <strong>Switchable Graphics Application Settings</strong> to verify GPU assignment rules.</li>
                        </ol>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-900 border-b pb-1 mb-2">Assigning Applications & Monitor</h4>
                        <p class="mb-2">To add high-performance applications manually: Navigate to settings, click <strong>Add Application</strong>, map the execution bin target, choose <strong>High Performance</strong>, and hit apply.</p>
                        <p class="text-xs text-gray-500 mt-2">Source: <a href="https://community.amd.com/docs/DOC-1581" target="_blank" class="text-blue-500 hover:underline">https://community.amd.com/docs/DOC-1581</a></p>
                    </div>
                </div>
            </div>

                <div id="topic-8" class="hidden p-6 bg-white border-t border-gray-100 text-gray-700 space-y-3">
                    <p><strong>Reason:</strong> It's not self-aware! It lacks core logic routing to discover available hardware topology allocation rules at launch.</p>
                    <p>You must manually match your core allocation profile to the "IPS instances" flag parameters via SSH terminal scripts to unlock full system bandwidth execution capabilities.</p>
                    <p class="font-semibold text-gray-900 mb-1">Execution Steps:</p>
                    <ol class="list-decimal pl-5 space-y-1">
                        <li>Enable Shell Access. SSH into device using <code class="bg-gray-100 text-red-600 px-1 rounded">loginuser</code>.</li>
                        <li>Run <code class="bg-gray-100 text-red-600 px-1 rounded">sudo su</code> to drop down to root privileges.</li>
                        <li>Execute the following commands sequence:</li>
                    </ol>
                    <div class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm shadow-inner whitespace-pre-line">
                        cat /proc/cpuinfo (confirms number of processors)
                        cc get ips num_instances (checks current setting)
                        cc set ips num_instances x (replace x with real core count)
                        /var/mdw/scripts/snort restart (reboots snort engine)
                    </div>

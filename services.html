                    <p class="text-xs font-mono text-indigo-600 mt-1">Post date: May 10, 2012 3:32:29 PM</p>

            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>On my 2008 Server, I run Hyper-V, and for whatever reason, this error code reared its ugly head while trying to update it.</p>
                <p>To Resolve this error code, do the following:<br>Open Notepad and type in the following:</p>
                <pre class="bg-gray-900 text-green-400 p-3 rounded font-mono text-xs overflow-x-auto">net stop wuauserv
cd %systemroot%\SoftwareDistribution
ren Download Download.old
net start wuauserv
net stop bits
net start bits</pre>
                <p>* Save the file as Repair.bat and place on the Desktop of your 2008 R2 Server.</p>
                <p>Run the batch file. After running the batch file, you will have to run the Service Pack again. It should go through this time! (Good Luck!)</p>
            </div>
        </details>

                    <h2 class="font-bold text-gray-900 text-lg">AMD Laptop with Radeon Graphics - Integrated Card in use</h2>
                    <p class="text-xs font-mono text-indigo-600 mt-1">Post date: Oct 24, 2017 7:29:38 PM</p>
                </div>
                <span class="chevron text-gray-400">▼</span>
            </summary>
            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <h3 class="font-bold text-gray-800">What is Switchable Graphics Technology?</h3>
                <p>Switchable Graphics is a laptop technology that utilizes both the graphical processing capabilities of a discrete graphics adapter and the power efficiency of an integrated graphics adapter. Switchable Graphics technology engages discrete graphics only when it is needed for 3D applications, and uses energy-efficient integrated graphics capabilities the rest of the time.</p>
                
                <h3 class="font-bold text-gray-800 mt-4">How to Enable Switchable Graphics?</h3>
                <p>To ensure full compatibility it is recommended to use the latest graphics driver for the integrated and high performance AMD graphics processor (GPU) provided by the laptop manufacturer. Switchable Graphics will not function if the power saving GPU does not have any display drivers installed.</p>
                <ul class="list-disc pl-5 space-y-1">
                    <li>Install the latest Intel graphics driver from the Intel or laptop manufacturer's website</li>
                    <li>Install the latest AMD graphics driver from the AMD or laptop manufacturer's website</li>
                </ul>
                <p><em>Note! Before installing the display drivers, check windows device manager to see if the GPUs are listed under Display Adapters. The high performance GPU may appear under other devices as a generic video controller.</em></p>

                <h3 class="font-bold text-gray-800 mt-4">Configuring Switchable Graphics</h3>
                <ul class="list-decimal pl-5 space-y-1">
                    <li>Right-click the Desktop and select AMD Radeon Settings from the menu.</li>
                    <li>Select Preferences.</li>
                    <li>Select Radeon Additional Settings.</li>
                    <li>Navigate to Power and select Switchable Graphics Application Settings to see a list of recent applications and which GPU they are using.</li>
                    <li>Select Switchable Graphics Global Settings to adjust your GPU settings for longer battery life or higher performance.</li>
                </ul>
                <p><em>Note! The high performance GPU may not be available when the laptop is running on battery power.</em></p>

                <h3 class="font-bold text-gray-800 mt-4">Assigning Applications to GPUs</h3>
                <ul class="list-decimal pl-5 space-y-1">
                    <li>Navigate to Radeon Settings > Preferences > Additional Settings > Power > Switchable Graphics Application Settings and the click Add Application.</li>
                    <li>Select the application you want to add and click Open.</li>
                    <li>Under Graphic Settings choose High Performance and click apply.</li>
                </ul>

                <h3 class="font-bold text-gray-800 mt-4">Switchable Graphics Application Monitor</h3>
                <p>Navigate to Radeon Settings > Preferences > Additional Settings > Power > Switchable Graphics Application Monitor and click Start Monitoring. An application executed whilst monitoring is enabled will appear in the list below and will show which applications are running on the high performance AMD GPU.</p>
            </div>
        </details>

                    <h2 class="font-bold text-gray-900 text-lg">Astaro / Sophos UTM - Enabling IPS - Cuts Bandwidth in Half</h2>
                    <p class="text-xs font-mono text-indigo-600 mt-1">Post date: Nov 07, 2016 3:4:48 PM</p>
                </div>
                <span class="chevron text-gray-400">▼</span>
            </summary>
            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>Astaro Security linux / Sophos UTM - Enabling IPS - Cuts Available Bandwidth in Half - Reason? It's not self aware! It doesn't have logic in the installation routing to understand how many cores are available to it.</p>
                <p>You need to manually look at how many cores you are running, then increase the number of "IPS instances" to reflect that number of cores, otherwise your firewall will not only bog down, but it won't show you why!</p>
                <p>You will need to enable shell access. SSH in using "loginuser". Then sudo su to root. Once root:</p>
                <pre class="bg-gray-900 text-green-400 p-3 rounded font-mono text-xs overflow-x-auto">cat /proc/cpuinfo (this confirms the number of installed CPUs).
cc get ips num_instances (this confirms the current setting).
cc set ips num_instances x (where x is the number of CPUs installed in your UTM).
/var/mdw/scripts/snort restart (the command to restart Snort)</pre>
            </div>
        </details>

                    <h2 class="font-bold text-gray-900 text-lg">BCM Firmware Update takes Hyper-V VM's Offline</h2>
                    <p class="text-xs font-mono text-indigo-600 mt-1">Post date: May 10, 2012 3:42:47 PM</p>
                </div>
                <span class="chevron text-gray-400">▼</span>
            </summary>
            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>PowerEdge 2950 BIOS; BCM Firmware Update takes Hyper-V VM's Offline.</p>
                <p>Today, because of an unrelated issue, it was advised by Dell to upgrade BIOS and the BCM Drivers on a production 2950 running three Hyper-V Virtual Machines. After successful installations, and subsequent reboots the system came up and acted fine as the host machine. What I didn't realize until I started receiving alerts was that my VM's had no network connectivity.</p>
                <p>First I checked each VM's settings, and verified the MAC Address to my documentation, to make sure everything was otherwise set correctly... it was. Second I looked in to the Host machine's Network connections, and found that they too looked fine, and all the settings were correct.</p>
                <p>However, when I went to look at the virtual switch, I noticed that the check mark for it was not selected, and upon selecting it, found that it would not stick!</p>
                <p>So, here is what I did to resolve this problem: I went in to the Hyper-V control panel, and under Actions, selected the Virtual Network Manager. I changed the Local Area Connection Network type to Private, and clicked Apply. This went through fine. Then I went to put it back on External, at first it wouldn't apply and an error occurred. I went in and looked at the adapter settings, and found that the actual Broadcom NIC had applied the Virtual Switch check box by itself. I unchecked it, then tried to reset to External. This time it applied, and the Virtual Switch came back online correctly.</p>
                <p>Once again, went in and verified all the settings, and everything looked perfect. I booted up the VM's and they came back online immediately.</p>
            </div>
        </details>

        <details class="group bg-white border border-gray-300 rounded-lg shadow-sm overflow-hidden">

                    <h2 class="font-bold text-gray-900 text-lg">Burger and Fries</h2>
                    <p class="text-xs font-mono text-indigo-600 mt-1">Post date: Jan 30, 2018 10:19:37 PM</p>
                </div>
                <span class="chevron text-gray-400">▼</span>
            </summary>
            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <h3 class="font-bold">Fries</h3>
                <p>Best to do outside; Use an outdoor BBQ side burner. Large 4 quart pan to boil the oil (Infared thermostat to measure the temp). Use basket strainer spoon to lower fries in to oil. (approx 2" of oil.) Use Canola oil for those with allergies, or Duck Fat cut with Peanut Oil for those that aren't allergic.</p>
                <p>Bring oil to min of 325 degrees with max of 375 degrees and maintain temp while prepping the fries. Use Kenebec potatos. Slice them into home fries, then soak in cold water. Move the fries around to rinse the starch off of the potatos. Then extract them, and pat them dry (this is an important step).</p>
                <p>Lower fries in to oil with basket strainer/spoon. Cook until golden brown, remove, and then immediately sprinkle kosher salt on to fries. Salt will bond to the surface of the fries. Kosher salt provides an excellent flavor to the fries.</p>
                
                <h3 class="font-bold mt-4">Fry Sauce - homemade Thousand Island</h3>
                <p>Best Foods Mayo, Sweet pickle relish, Barley Malt Vinegar, Worcestershire sauce, Ketchup, sugar, pinch of kosher salt, lemon rind. Whisk to combine.</p>
                
                <h3 class="font-bold mt-4">The Burger</h3>
                <p>Cast iron skillet. 80/20 ground chuck (or as an option- Ground Turkey with finely diced bacon - Turkey patties should be 1/4" thick). Make 4 ounce beef patties - put small amount of canola oil and brush on to plate surface, and back of other plate, put meat between plates and press until 1/2 thick.</p>
                <p>Remove meat and salt/pepper both sides. Then brush yellow mustard on both sides. Fry on cast iron until that first side is nearly burnt, should be crisp and dark. Flip and add cheese. If you want red onion on the burger, slice thin, then soak slices in cold water until ready to plate. Pat Dry before plating.</p>
                <p>Iceberg Lettuce notes: Take head of lettuce and pound it, with stem side down on table top, 2 quick thumps. Stem should just pop out. Take lettuce leaves, outer ones, and press flat. Cut them just larger than the bun size, in triangles. 2 leaves per burger.</p>
                <p>Bun is a brioche bun. After removing burgers, add small amount of oil and turn off the heat. Put bun slices face down on pan and move around a little. Buns will use the oil and the oil will prevent the bun from sticking to surface. Top Bun: ketchup only. Bottom bun: (this order) Mayo, pickle slices, red onion slices, iceberg triangles, then burger with cheese.</p>

                <h3 class="font-bold mt-4">Malted Choc Shake to go with?</h3>

            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>If you are having trouble hooking up your Cisco SPA 112 phone adapter to your active directory domain, you are not alone. The SPA 112 doesn't play nicely with Microsoft AD. To get around this problem, you have to have an alternate way to assign it an IP address.</p>
                <p>I hooked it up to a standard off the shelf wireless router by an Ethernet cable, and then logged in to the router and saw the dynamically assigned IP address for the SPA-112. From there, you just plug in your laptop to that same router get an auto-assigned IP address, open a web browser, point to that IP address assigned to the SPA 112, example <code>http://192.168.1.2</code>, and from within the SPA's control panel, assign it a static IP that matches what you want it to be on your AD Domain.</p>
                <p>Once you have applied the IP, Save, and then close the browser. Take the device off of the wireless router and move it to your AD wired network. Once the SPA boots up, it will be part of the domain using the newly assigned address. Then you can log in to it using the static IP you assigned it and configure it for your hosted VOIP platform.</p>
                <p>Default admin / pass: <strong>Admin / admin</strong></p>
                <p>Default user / pass: <strong>Cisco / cisco</strong></p>
            </div>
        </details>

            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>If you are trying to send yourself test messages from Constant Contact, and your Outlook email client is refusing to pull the images down and display them correctly, there is a quick way to get this fixed.</p>
                <p>Internet Explorer has a security setting that, when enabled, prevents Outlook from displaying images with a secure URL. To remedy the situation, you can change the setting in two ways, through control panel or through the IE, the browser itself.</p>
                <ul class="list-decimal pl-5 space-y-1">
                    <li>Open Internet Explorer.</li>
                    <li>Go to Tools > Internet Options.</li>
                    <li>Click the Advanced tab.</li>
                    <li>Scroll down to the Security settings list, then uncheck the "Do not save encrypted pages to disk" option.</li>
                    <li>Click OK.</li>
                </ul>
                <p>Before the changes take effect, we may need to also clear the cache in Internet Explorer and then close Outlook (File > Exit to close fully). After re-launching Outlook, send yourself another email with Constant Contact. The email should render properly.</p>
            </div>
        </details>

                    <p class="text-xs font-mono text-indigo-600 mt-1">Post date: Oct 05, 2016 2:40:18 PM</p>
                </div>
                <span class="chevron text-gray-400">▼</span>
            </summary>
            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>If you find that office 2013 or 2016 is crashing repeatedly on you using Windows 10, you may be suffering from a problem with hardware acceleration being activated from within your office suite.</p>
                <p>To disable it, open Word or Excel, click on the File Tab, click Options, Then select Advanced from the list on the left. Look for a check box that says "Disable hardware graphics acceleration", click the box, then click OK. Close the program, restart the computer, then you should be good to go.</p>
                <p>Via Regedit:</p>
                <pre class="bg-gray-100 p-3 rounded font-mono text-xs overflow-x-auto text-red-600">
HKEY_CURRENT_USER\Software\Microsoft\Office\15.0\Common
Click on the Graphics sub folder
New Key Subkey Graphics, then create DWORD DisableHardwareAcceleration, Hex Value 1, Click Ok.
Reboot</pre>
            </div>
        </details>

            <div class="px-6 py-6 border-t border-gray-200 bg-white text-sm text-gray-700 space-y-3">
                <p>Step 1 - Start: <code>apt-get update</code> Then install vsftpd and required packages: <code>apt-get -y install vsftpd</code></p>
                <p>Step 2: Configure vsftpd. Edit the configuration file for vsftpd: <code>sudo nano /etc/vsftpd.conf</code></p>
                <p>Remove anonymous access, unidentified users to FTP; change the anonymous_enable setting to NO: <code>anonymous_enable=NO</code>. Allow local uses to login by changing the local_enable setting to YES: <code>local_enable=YES</code>.</p>
                <p>Want local user to be able to write to a directory? Then change the write_enable setting to YES: <code>write_enable=YES</code>. Local users will be ‘chroot jailed’ and they will be denied access to any other part of the server; change the chroot_local_user setting to YES: <code>chroot_local_user=YES</code>.</p>
                <p>Exit and save using Cntrl +X then Y, then Enter. Restart the vsftpd service: <code>service vsftpd restart</code></p>
            </div>
        </details>

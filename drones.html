Hubsan H107D with Landing Gear<BR>Post date: Nov 05, 2016 1:16:42 AM
<BR>
        <BR>
        I was watching this video: (https://www.youtube.com/watch?v=jN68hbcbjYg)  the other day, and saw the use of a cable tie to help point the antenna down instead of straight out like it comes from the factory to gain extra range.
On a spur of the moment decision, I decided to give it a try. I for the most part followed the directions in the video, and then just kept going, adding ties to each arm. Then, using the short leg where the antenna was tied, I clipped the rest to match. Using the remainder of two of the ties I created skids, and using two more, I made them more stable by adding wide cross bars. I enhanced the visibility of the rear red LED's, red propellers by adding red cable ties to the back end.
What you see here are cable ties, and bonding by hot glue.<BR>
        You can see it Fly here: https://youtu.be/a3BzYTm1uT4 (this is with the landing gear installed.)
Note: It's also got a 500 Lipo battery in it from Drone Pit Stop.  The added weight makes it a bit sluggish, but it's still quite fast and maneuverable, and can still do flips quite easily.

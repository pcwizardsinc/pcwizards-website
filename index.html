<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chadick.org</title>
    <style>
        /* Smooth loading screen while assets resolve */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; }
        #loader { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, sans-serif; color: #5f6368; font-size: 18px; }
    </style>
</head>
<body>
    <div id="loader">Loading Chadick.org...</div>

    <script>
        // 1. Fetch your raw Google Sites code safely from your repository
        fetch('./source.html')
            .then(response => response.text())
            .then(html => {
                // 2. Fix the broken relative system assets and route them to Google's live CDN
                let cleanHTML = html
                    .replace(/="\/_\/ss\//g, '="https://sites.google.com/_/ss/')
                    .replace(/="\/_\/js\//g, '="https://sites.google.com/_/js/')
                    .replace(/href="\/site\//g, 'href="https://sites.google.com/site/');

                // 3. Inject custom CSS to cleanly hide Google's system footers, utility layers, and tracking banners
                const cloudflareStyles = `
                    <style>
                        .hUphyc, .YkaBSd, .iBkmkf, .VTBa7b, .MbhUzd, [jsname="Bg3gkf"], [aria-label="Site actions"], .kV96Dc, .w77Gid {
                            display: none !important;
                            visibility: hidden !important;
                            opacity: 0 !important;
                            height: 0 !important;
                            pointer-events: none !important;
                        }
                    </style>
                `;
                
                cleanHTML = cleanHTML.replace('</head>', cloudflareStyles + '</head>');

                // 4. Render the optimized site seamlessly into the client canvas
                document.open();
                document.write(cleanHTML);
                document.close();
            })
            .catch(err => {
                document.getElementById('loader').innerText = 'Error optimizing site assets.';
                console.error(err);
            });
    </script>
</body>
</html>
